name: CodeQL

# Replaces GitHub's default CodeQL setup so the Go analysis can
# finish. Default setup runs the whole default suite; one Go query
# overflows CodeQL's 2 GiB result-set cap and fails the job. The
# config at .github/codeql/codeql-config.yml drops only that query.
# Disable the repository's default CodeQL setup if it is re-enabled,
# or both workflows will run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "42 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
