name: Publish container image

# Builds the Dockerfile and pushes it to Docker Hub as docker.io/bzynchub/nextsql.
# Pull requests that touch the image build it but do not push. Pushes to master
# publish a moving `edge` tag; pushing a release tag like v0.1.0 publishes the
# matching semver tags (0.1.0, 0.1, and — once past 0.x — the major). Every
# build also gets an immutable `sha-<short>` tag.
#
# Images are multi-arch (linux/amd64, linux/arm64). The arm64 leg builds
# under QEMU emulation, so it is slower than the native amd64 leg.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  a Docker Hub account with push access to bzynchub/nextsql
#   DOCKERHUB_TOKEN     a Docker Hub access token (Account Settings → Personal
#                       access tokens), Read/Write scope
# The bzynchub/nextsql repository must already exist on Docker Hub.

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/docker-publish-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: docker.io/bzynchub/nextsql

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=NextSQL
            org.opencontainers.image.description=Native, encrypted-by-default multimodel database engine

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
