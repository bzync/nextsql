name: Publish container image

# Builds the Dockerfile and pushes it to Docker Hub as docker.io/bzynchub/nextsql.
# ONLY a release tag push (`v*.*.*`) publishes an image. master pushes and
# pull requests that touch the image build it and scan it (amd64 only, for
# fast feedback) but never push — no `sha-<short>` tag, no `edge` tag, nothing.
# Pushing a release tag like v0.0.1 publishes exactly one version tag (`0.0.1`).
#
# Every published tag is write-once: no moving `latest`/`edge`/`0.0` pointers,
# and no per-commit `sha-` tags. The Docker Hub repository is configured "All
# tags are immutable", so a second push to an existing tag is rejected —
# re-cutting a release means bumping the version. Consumers pin an explicit
# `0.x.y` tag.
#
# Images are multi-arch (linux/amd64, linux/arm64). The arm64 leg builds
# under QEMU emulation, so it is slower than the native amd64 leg.
#
# Every build is scanned with Trivy before it is pushed; a fixable CRITICAL or
# HIGH OS/library vulnerability fails the workflow.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  a Docker Hub account with push access to bzynchub/nextsql
#   DOCKERHUB_TOKEN     a Docker Hub access token (Account Settings → Personal
#                       access tokens), Read/Write scope
# The bzynchub/nextsql repository must already exist on Docker Hub.
#
# Actions are pinned to commit SHAs (supply-chain hardening); the trailing
# comment is the human-readable version. Dependabot's github-actions ecosystem
# keeps them current.

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "cmd/nextsql-entrypoint/**"
      - "internal/dockerentry/**"
      - ".github/workflows/docker-publish-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: docker.io/bzynchub/nextsql

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # The Docker Hub repo is "All tags are immutable" — only write-once
          # tags. No moving pointers: no `latest` (flavor disables it), no
          # `edge`, no `{{major}}.{{minor}}`/`{{major}}` rollups, and no
          # per-commit `sha-` tags. The only tag emitted is the `v*.*.*`
          # release version, so on any non-tag ref this list is empty and the
          # publish step below is skipped.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=NextSQL
            org.opencontainers.image.description=Native, encrypted-by-default multimodel database engine

      # Build a single-arch image into the local Docker engine so Trivy can
      # scan the exact bytes that will be published. Shares the buildx cache
      # with the publish step below, so this is not a wasted build.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Only a release tag publishes. On master / PR / manual dispatch this step
      # is skipped entirely — the scan build above is the CI signal there.
      - name: Build and push
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
