name: Deploy docs site to GitHub Pages

# docs/web is a pure static site (landing page, /docs, and /download — a
# read-only release history; actual binaries live wherever they're hosted,
# since public/downloads/** is gitignored). `next build` emits static HTML
# into out/, which this workflow publishes to GitHub Pages as-is.

on:
  push:
    branches: [master]
    paths:
      - "docs/web/**"
      - "content/docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        working-directory: docs/web
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        working-directory: docs/web
        env:
          NEXTSQL_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
