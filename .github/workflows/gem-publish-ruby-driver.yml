name: Publish Ruby driver to RubyGems

# Publishes drivers/ruby as the `bzync-nextsql` gem ("gem install bzync-nextsql",
# then `require "nextsql"`). Pure standard library, so no bundle/install step.
#
# Three ways in:
#   * push a tag `ruby-v0.1.0`                          (this driver only)
#   * `workflow_dispatch` with ref + version            (manual re-run)
#   * called by `release-drivers.yml` via workflow_call (all drivers at once)
# The resolved version must match drivers/ruby/lib/nextsql/version.rb, or the
# job fails before publishing.
#
# Uses RubyGems.org Trusted Publishing (OIDC) — configure a trusted publisher
# on rubygems.org for gem "bzync-nextsql" with repository "bzync/nextsql" and
# workflow "gem-publish-ruby-driver.yml" (add it as a "pending" publisher
# before the gem exists). No environment, no API key secret.

on:
  push:
    tags:
      - "ruby-v*.*.*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and publish from"
        required: false
        type: string
      version:
        description: "Version to verify against the manifest and publish"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (default: this ref)"
        required: false
        type: string
      version:
        description: "Version to publish, e.g. 0.1.0 (default: derived from a ruby-v* tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # RubyGems Trusted Publishing
    defaults:
      run:
        working-directory: drivers/ruby
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          rubygems: latest

      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#ruby-v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version matches version.rb
        run: |
          want="${{ steps.v.outputs.version }}"
          have="$(ruby -Ilib -rnextsql/version -e 'print NextSQL::VERSION')"
          if [ "$want" != "$have" ]; then
            echo "::error::Requested version $want does not match NextSQL::VERSION $have"
            exit 1
          fi

      - name: Test
        run: ruby -Ilib -Itest test/test_protocol.rb

      - name: Build
        run: gem build bzync-nextsql.gemspec

      - name: Configure RubyGems trusted publishing (OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish
        run: gem push bzync-nextsql-*.gem
