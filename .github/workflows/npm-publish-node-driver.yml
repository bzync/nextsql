name: Publish Node driver to npm

# Publishes drivers/node as @bzync/nextsql ("npm i @bzync/nextsql"). Triggered
# by pushing a tag like node-v0.1.0 — the tag version must match
# drivers/node/package.json's "version" field, or the job fails before
# publishing. Zero runtime dependencies, so no lockfile/install step needed.
#
# Auth: npm CLI >= 11.5.1 uses GitHub OIDC (Trusted Publishing) when a trusted
# publisher is configured for @bzync/nextsql on npmjs.com, and otherwise falls
# back to NODE_AUTH_TOKEN. The FIRST publish creates the package and must use
# the NPM_TOKEN secret (npm has no pending-publisher flow); once the package
# exists, add a trusted publisher (repo bzync/nextsql, this workflow file) and
# the NPM_TOKEN secret can be removed.

on:
  push:
    tags:
      - "node-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (e.g. node-v0.1.0), for a manual re-run"
        required: false
        type: string

defaults:
  run:
    working-directory: drivers/node

permissions:
  contents: read
  id-token: write # npm provenance + Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an OIDC-capable npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag_version="${ref#node-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $ref (version $tag_version) does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Test
        run: node --test nextsql.test.js

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
