name: Publish Node driver to npm

# Publishes drivers/node as @bzync/nextsql ("npm i @bzync/nextsql").
#
# Three ways in:
#   * push a tag `node-v0.1.0`                          (this driver only)
#   * `workflow_dispatch` with ref + version            (manual re-run)
#   * called by `release-drivers.yml` via workflow_call (all drivers at once)
# The resolved version must match drivers/node/package.json "version", or the
# job fails before publishing. Zero runtime dependencies.
#
# Auth: npm CLI >= 11.5.1 uses GitHub OIDC (Trusted Publishing) when a trusted
# publisher is configured for @bzync/nextsql on npmjs.com, and otherwise falls
# back to NODE_AUTH_TOKEN. The FIRST publish creates the package and must use
# the NPM_TOKEN secret (npm has no pending-publisher flow); once the package
# exists, add a trusted publisher (repo bzync/nextsql, this workflow file) and
# the NPM_TOKEN secret can be removed.

on:
  push:
    tags:
      - "node-v*.*.*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and publish from"
        required: false
        type: string
      version:
        description: "Version to verify against the manifest and publish"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (default: this ref)"
        required: false
        type: string
      version:
        description: "Version to publish, e.g. 0.1.0 (default: derived from a node-v* tag)"
        required: false
        type: string
      yank_versions:
        description: "If set (comma-separated), unpublish these npm versions instead of publishing"
        required: false
        type: string

defaults:
  run:
    working-directory: drivers/node

permissions:
  contents: read
  id-token: write # npm provenance + Trusted Publishing

jobs:
  yank:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.yank_versions != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an OIDC-capable npm
        run: npm install -g npm@latest
      - name: Unpublish via trusted publishing
        env:
          VERSIONS: ${{ inputs.yank_versions }}
        run: |
          set -euo pipefail
          # Do not set NODE_AUTH_TOKEN: the granular token cannot unpublish
          # when 2FA is required. OIDC trusted publishing is the owner.
          IFS=',' read -ra vers <<< "$VERSIONS"
          for v in "${vers[@]}"; do
            v="$(echo "$v" | tr -d '[:space:]')"
            [ -n "$v" ] || continue
            echo "unpublish @bzync/nextsql@$v"
            npm unpublish "@bzync/nextsql@$v" --force
          done

  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.yank_versions == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an OIDC-capable npm
        run: npm install -g npm@latest

      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#node-v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version matches package.json
        run: |
          want="${{ steps.v.outputs.version }}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::Requested version $want does not match package.json version $have"
            exit 1
          fi

      - name: Test
        run: node --test nextsql.test.js

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          if npm publish --access public --provenance; then
            exit 0
          fi
          # A lower version cannot take `latest` implicitly (npm refuses
          # 0.0.1 while 0.1.x exists). Publish under a version tag, then
          # move `latest` explicitly.
          npm publish --access public --provenance --tag "v${version}"
          npm dist-tag add "@bzync/nextsql@${version}" latest
