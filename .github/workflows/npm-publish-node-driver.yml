name: Publish Node driver to npm

# Publishes drivers/node as @bzync/nextsql ("npm i @bzync/nextsql"). Triggered
# by pushing a tag like node-v0.1.0 — the tag version must match
# drivers/node/package.json's "version" field, or the job fails before
# publishing. Zero runtime dependencies, so no lockfile/install step needed.

on:
  push:
    tags:
      - "node-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (e.g. node-v0.1.0), for a manual re-run"
        required: false
        type: string

defaults:
  run:
    working-directory: drivers/node

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag_version="${ref#node-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $ref (version $tag_version) does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Test
        run: node --test nextsql.test.js

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
