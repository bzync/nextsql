name: Publish PHP driver to Packagist

# Packagist resolves a package from a repository's root composer.json, but the
# PHP driver lives in a subdirectory of this monorepo. This workflow splits
# drivers/php/ into the standalone read-only mirror repo bzync/nextsql-php and
# pushes a `v<version>` tag there; Packagist watches that mirror and picks it up.
#
# Three ways in:
#   * push a tag `php-v0.1.0`                           (this driver only)
#   * `workflow_dispatch` with ref + version            (manual re-run)
#   * called by `release-drivers.yml` via workflow_call (all drivers at once)
# A "version" key is not required in drivers/php/composer.json — Packagist
# derives it from the mirror's git tag — so the check below only guards the name.
#
# One-time setup:
#   1. Create an empty github.com/bzync/nextsql-php repository.
#   2. Submit https://github.com/bzync/nextsql-php to https://packagist.org
#      once (it then auto-updates via the GitHub webhook Packagist installs).
#   3. Add a PHP_SPLIT_TOKEN repository secret: a fine-grained PAT with
#      Contents: read/write on bzync/nextsql-php. The split job must check out
#      with persist-credentials: false, or that PAT is ignored -- see below.

on:
  push:
    tags:
      - "php-v*.*.*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and split from"
        required: false
        type: string
      version:
        description: "Version to tag on the mirror"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (default: this ref)"
        required: false
        type: string
      version:
        description: "Version to publish, e.g. 0.1.0 (default: derived from a php-v* tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — subtree split needs it)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          # Without this, checkout leaves an http.https://github.com/.extraheader
          # carrying the github-actions[bot] token. That header matches *every*
          # github.com URL, so it overrides the PAT in the push URL below and the
          # mirror push fails with "Permission to bzync/nextsql-php.git denied to
          # github-actions[bot]" -- a 403 that looks like a bad PAT but is not.
          persist-credentials: false

      - name: Validate composer.json
        run: |
          php -r 'exit(json_decode(file_get_contents("drivers/php/composer.json"))->name === "bzync/nextsql" ? 0 : 1);' \
            || { echo "::error::drivers/php/composer.json name must be bzync/nextsql"; exit 1; }

      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#php-v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Split drivers/php and push to the mirror
        env:
          SPLIT_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SPLIT_TOKEN}" ]; then
            echo "::error::PHP_SPLIT_TOKEN is empty -- a called workflow needs 'secrets: inherit'."
            exit 1
          fi
          git config user.name "nextsql-release"
          git config user.email "release@bzync.com"
          split_sha="$(git subtree split --prefix=drivers/php HEAD)"
          git push "https://x-access-token:${SPLIT_TOKEN}@github.com/bzync/nextsql-php.git" \
            "${split_sha}:refs/heads/master" --force
          git push "https://x-access-token:${SPLIT_TOKEN}@github.com/bzync/nextsql-php.git" \
            "${split_sha}:refs/tags/v${VERSION}"
