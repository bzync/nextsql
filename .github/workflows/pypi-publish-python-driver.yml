name: Publish Python driver to PyPI

# Publishes drivers/python as `bzync-nextsql` ("pip install bzync-nextsql", then
# `import nextsql`). Pure standard library, no runtime dependencies.
#
# Three ways in:
#   * push a tag `python-v0.1.0`                        (this driver only)
#   * `workflow_dispatch` with ref + version            (manual re-run)
#   * called by `release-drivers.yml` via workflow_call (all drivers at once)
# The resolved version must match nextsql.__version__, or the job fails before
# publishing.
#
# Uses PyPI Trusted Publishing (OIDC) — configure a trusted publisher on PyPI
# for project "bzync-nextsql" with workflow "pypi-publish-python-driver.yml"
# and environment "pypi". No API token secret needed.

on:
  push:
    tags:
      - "python-v*.*.*"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and publish from"
        required: false
        type: string
      version:
        description: "Version to verify against the manifest and publish"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out (default: this ref)"
        required: false
        type: string
      version:
        description: "Version to publish, e.g. 0.1.0 (default: derived from a python-v* tag)"
        required: false
        type: string
      yank_versions:
        description: "If set (comma-separated), yank these PyPI versions instead of publishing"
        required: false
        type: string

permissions:
  contents: read

jobs:
  yank:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.yank_versions != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Yank via trusted publishing
        env:
          VERSIONS: ${{ inputs.yank_versions }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, sys, urllib.error, urllib.request

          def request(url, data=None, headers=None, method=None):
              req = urllib.request.Request(url, data=data, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi"
          status, body = request(
              oidc_url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          if status != 200:
              sys.exit(f"github oidc token failed: {status} {body[:500]!r}")
          github_token = json.loads(body)["value"]
          status, body = request(
              "https://pypi.org/_/oidc/github/mint-token",
              data=json.dumps({"token": github_token}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          if status != 200:
              sys.exit(f"pypi mint-token failed: {status} {body[:800]!r}")
          token = json.loads(body)["token"]
          basic = base64.b64encode(("__token__:" + token).encode()).decode()
          failed = False
          for raw in os.environ["VERSIONS"].split(","):
              version = raw.strip()
              if not version:
                  continue
              status, body = request(
                  f"https://pypi.org/pypi/bzync-nextsql/{version}/yank",
                  data=b"",
                  headers={"Authorization": "Basic " + basic},
                  method="POST",
              )
              print(f"yank {version}: {status} {body[:300]!r}")
              if status not in (200, 201, 204):
                  failed = True
          if failed:
              sys.exit(1)
          PY

  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.yank_versions == '' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#python-v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version matches nextsql.__version__
        working-directory: drivers/python
        run: |
          want="${{ steps.v.outputs.version }}"
          have="$(python -c 'import nextsql; print(nextsql.__version__)')"
          if [ "$want" != "$have" ]; then
            echo "::error::Requested version $want does not match nextsql.__version__ $have"
            exit 1
          fi

      - name: Test
        working-directory: drivers/python
        run: python tests/test_protocol.py

      - name: Build
        working-directory: drivers/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: drivers/python/dist
