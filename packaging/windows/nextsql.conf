# NextSQL server configuration (key=value). Unknown keys are rejected.
# Command-line flags override this file.
#
# The root unlock key is never stored in the data directory. Keep key_file
# on a different volume from data_dir in production.

data_dir=C:/ProgramData/NextSQL/data
key_file=C:/ProgramData/NextSQL/keys/root.key
listen_addr=127.0.0.1:7210
log_level=info
buffer_pages=1024

# Non-loopback listen addresses require TLS 1.3.
# tls_cert=C:/ProgramData/NextSQL/tls/server.crt
# tls_key=C:/ProgramData/NextSQL/tls/server.key

require_client_key=false
# wal_archive=C:/ProgramData/NextSQL/wal-archive

max_inflight_queries=32
max_query_queue=128
query_queue_wait_ms=5000
max_result_rows=1000000

raft_bootstrap=false
